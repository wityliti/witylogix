openapi: 3.1.0
info:
  title: Witylogix API
  version: 2.0.0
  description: |
    Witylogix Platform API for delivery logistics, order management, and driver operations.

    ## Features
    - Multi-tenant SaaS architecture with shop/organization isolation
    - Real-time order tracking and delivery updates
    - Intelligent route optimization and assignment
    - Driver management and performance analytics
    - Webhook-driven integrations with e-commerce platforms
    - Rate limiting and quota management per tenant plan

    ## Authentication
    - **JWT Bearer tokens** for dashboard users and drivers
    - **API Keys** (wl_live_*, wl_test_*) for server-to-server requests
    - **OAuth2/SSO** for partner integrations
  contact:
    name: Witylogix Support
    email: support@witylogix.com
    url: https://witylogix.com
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.witylogix.com
    description: Production API server
  - url: https://staging-api.witylogix.com
    description: Staging API server

security:
  - bearerAuth: []
  - apiKey: []
  - oauth2: [orders.read, orders.write, drivers.read, routes.read]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v4/auth/login or /api/v4/auth/refresh

    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API Key for server-to-server authentication.
        Format: wl_live_* (production) or wl_test_* (sandbox)

    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.witylogix.com/oauth2/authorize
          tokenUrl: https://api.witylogix.com/oauth2/token
          refreshUrl: https://api.witylogix.com/oauth2/refresh
          scopes:
            orders.read: Read order data
            orders.write: Create and update orders
            drivers.read: Read driver information
            drivers.write: Update driver status
            routes.read: View route plans
            routes.write: Create and optimize routes
            deliveries.read: View delivery status
            webhooks.manage: Manage webhook endpoints

  schemas:
    # ─── Pagination ─────────────────────────────────────────────────
    PaginationQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: Page number (1-indexed)
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Results per page
        sortBy:
          type: string
          description: Field to sort by (endpoint-specific)
        sortOrder:
          type: string
          enum: [asc, desc]
          default: asc

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          description: Array of items
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              description: Total number of items
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrev:
              type: boolean

    # ─── Error Response ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g., AUTH_UNAUTHORIZED, VALIDATION_ERROR)
            message:
              type: string
              description: Human-readable error message
            details:
              oneOf:
                - type: object
                  description: Additional error context (field-level validation errors, etc.)
                - type: array
                  items:
                    type: object
            requestId:
              type: string
              format: uuid
              description: Unique request ID for debugging

    # ─── Auth ────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password, shopDomain]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        shopDomain:
          type: string
          description: Shopify store domain (e.g., mystore.myshopify.com)

    DriverLoginRequest:
      type: object
      required: [phone, password, shopDomain]
      properties:
        phone:
          type: string
          minLength: 5
          description: Driver phone number
        password:
          type: string
          minLength: 6
        shopDomain:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT access token (valid 1 hour)
        refreshToken:
          type: string
          description: Refresh token for obtaining new access tokens (valid 30 days)
        expiresIn:
          type: integer
          description: Access token expiration time in seconds
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            role:
              type: string
              enum: [SUPER_ADMIN, ADMIN, DISPATCHER, DRIVER, CUSTOMER]

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret
        qrCode:
          type: string
          format: uri
          description: Data URI for QR code image
        backupCodes:
          type: array
          items:
            type: string
          minItems: 10

    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit TOTP code
        deviceId:
          type: string
          description: Device identifier for trust

    PasswordResetRequest:
      type: object
      required: [email, shopDomain]
      properties:
        email:
          type: string
          format: email
        shopDomain:
          type: string

    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Password reset token from email
        password:
          type: string
          minLength: 8

    # ─── Orders ──────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, shopId, status, customerName]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        shopifyOrderId:
          type: string
          description: External Shopify order ID
        shopifyOrderNumber:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, ACCEPTED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, ARRIVED, DELIVERED, FAILED, RETURNED, CANCELLED]
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
          nullable: true
        customerPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        province:
          type: string
          nullable: true
        postalCode:
          type: string
        country:
          type: string
        deliveryDate:
          type: string
          format: date
          nullable: true
        deliveryTimeWindow:
          type: object
          nullable: true
          properties:
            start:
              type: string
              format: time
            end:
              type: string
              format: time
        driverId:
          type: string
          format: uuid
          nullable: true
        totalPrice:
          type: number
          format: double
          nullable: true
        totalWeight:
          type: number
          format: double
          nullable: true
          description: Total weight in kilograms
        itemCount:
          type: integer
        lineItems:
          type: array
          items:
            type: object
            properties:
              shopifyLineId:
                type: string
              title:
                type: string
              quantity:
                type: integer
              price:
                type: number
              sku:
                type: string
                nullable: true
              grams:
                type: number
                nullable: true
        trackingToken:
          type: string
          description: Public token for customer tracking page
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [customerName, addressLine1, city, postalCode, country]
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
          nullable: true
        customerPhone:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
        province:
          type: string
          nullable: true
        postalCode:
          type: string
        country:
          type: string
        deliveryDate:
          type: string
          format: date
          nullable: true
        totalPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, ARRIVED, DELIVERED, FAILED, RETURNED, CANCELLED]
        notes:
          type: string
          nullable: true
          description: Status update notes (e.g., failure reason)
        proofOfDelivery:
          type: object
          nullable: true
          properties:
            signatureUrl:
              type: string
              format: uri
            photosUrls:
              type: array
              items:
                type: string
                format: uri

    AssignOrderRequest:
      type: object
      required: [driverId]
      properties:
        driverId:
          type: string
          format: uuid

    # ─── Drivers ─────────────────────────────────────────────────────
    Driver:
      type: object
      required: [id, shopId, name, phone, status]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ON_LEAVE, TERMINATED]
          description: Current driver status
        vehicleType:
          type: string
          enum: [MOTORCYCLE, CAR, VAN, TRUCK]
          nullable: true
        vehicleLicensePlate:
          type: string
          nullable: true
        license:
          type: object
          nullable: true
          properties:
            number:
              type: string
            expiryDate:
              type: string
              format: date
        currentLocation:
          type: object
          nullable: true
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            updatedAt:
              type: string
              format: date-time
        assignedOrders:
          type: integer
          description: Number of currently assigned orders
        completedDeliveries:
          type: integer
          description: Lifetime completed deliveries
        averageRating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDriverRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        vehicleType:
          type: string
          enum: [MOTORCYCLE, CAR, VAN, TRUCK]
          nullable: true
        vehicleLicensePlate:
          type: string
          nullable: true

    UpdateDriverRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ON_LEAVE, TERMINATED]
        vehicleType:
          type: string
          enum: [MOTORCYCLE, CAR, VAN, TRUCK]
          nullable: true
        vehicleLicensePlate:
          type: string
          nullable: true

    DriverStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ON_DELIVERY, BREAK, UNAVAILABLE]
          description: Driver operational status

    # ─── Zones ───────────────────────────────────────────────────────
    Zone:
      type: object
      required: [id, shopId, name]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        name:
          type: string
          description: Zone name (e.g., "Downtown", "Suburbs")
        description:
          type: string
          nullable: true
        geometry:
          type: object
          nullable: true
          description: GeoJSON polygon for zone boundaries
        deliveryRates:
          type: array
          items:
            type: object
            properties:
              minWeight:
                type: number
              maxWeight:
                type: number
                nullable: true
              rate:
                type: number
              currency:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateZoneRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        geometry:
          type: object
          nullable: true
          description: GeoJSON polygon

    # ─── Routes ──────────────────────────────────────────────────────
    Route:
      type: object
      required: [id, shopId, date, status]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, OPTIMIZED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED]
        driverId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          nullable: true
        totalDistance:
          type: number
          description: Total route distance in kilometers
        estimatedDuration:
          type: number
          description: Estimated route duration in minutes
        stops:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              sequence:
                type: integer
              orderId:
                type: string
                format: uuid
                nullable: true
              stopType:
                type: string
                enum: [PICKUP, DELIVERY, RETURN, DEPOT]
              status:
                type: string
              actualArrival:
                type: string
                format: date-time
                nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRouteRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          nullable: true
        driverId:
          type: string
          format: uuid
          nullable: true
        orderIds:
          type: array
          items:
            type: string
            format: uuid

    # ─── Integrations ────────────────────────────────────────────────
    Integration:
      type: object
      required: [id, shopId, type, status]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        type:
          type: string
          enum: [SHOPIFY, WOOCOMMERCE, MAGENTO, CUSTOM_API, CUSTOM_WEBHOOK]
        status:
          type: string
          enum: [INACTIVE, CONFIGURED, ACTIVE, ERROR]
        webhookUrl:
          type: string
          format: uri
          nullable: true
        webhookSecret:
          type: string
          nullable: true
        config:
          type: object
          description: Integration-specific configuration
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        lastErrorAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InstallIntegrationRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [SHOPIFY, WOOCOMMERCE, MAGENTO, CUSTOM_API, CUSTOM_WEBHOOK]
        config:
          type: object
          nullable: true
          description: Integration configuration parameters

    # ─── Webhooks ────────────────────────────────────────────────────
    WebhookEndpoint:
      type: object
      required: [id, shopId, url]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: HTTPS endpoint for webhook deliveries
        events:
          type: array
          items:
            type: string
            enum:
              - order.created
              - order.updated
              - order.assigned
              - order.status_changed
              - delivery.completed
              - delivery.failed
              - driver.location_updated
              - route.optimized
              - integration.error
          description: Events this endpoint subscribes to
        secret:
          type: string
          description: HMAC-SHA256 signature secret
        isActive:
          type: boolean
        failureCount:
          type: integer
          description: Consecutive delivery failures
        lastDeliveryAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      required: [id, endpointId, event, status]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        event:
          type: string
        payload:
          type: object
        signature:
          type: string
          description: HMAC-SHA256 signature
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, RETRYING]
        statusCode:
          type: integer
          nullable: true
        responseBody:
          type: string
          nullable: true
        retryCount:
          type: integer
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            minItems: 1
        isActive:
          type: boolean
          default: true

    # ─── Admin ───────────────────────────────────────────────────────
    User:
      type: object
      required: [id, shopId, email, role]
      properties:
        id:
          type: string
          format: uuid
        shopId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, DISPATCHER, DRIVER, CUSTOMER]
        isActive:
          type: boolean
        mfaEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
          enum: [FREE, PRO, ENTERPRISE]
        maxShops:
          type: integer
        maxUsers:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── API Keys ────────────────────────────────────────────────────
    ApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Only returned once on creation. Store securely.
        name:
          type: string
        type:
          type: string
          enum: [LIVE, TEST]
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [name, type, scopes]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [LIVE, TEST]
        scopes:
          type: array
          items:
            type: string
          minItems: 1

paths:
  # ─── Authentication ──────────────────────────────────────────────────
  /api/v4/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v4/auth/driver/login:
    post:
      tags: [Auth]
      summary: Driver login with phone and password
      operationId: driverLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLoginRequest'
      responses:
        '200':
          description: Driver login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v4/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v4/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate refresh token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string

  /api/v4/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Setup multi-factor authentication
      operationId: setupMfa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MFA setup details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MfaSetupResponse'

  /api/v4/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA code and enable 2FA
      operationId: verifyMfa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      backupCodes:
                        type: array
                        items:
                          type: string

  /api/v4/auth/password/reset:
    post:
      tags: [Auth]
      summary: Request password reset link
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
