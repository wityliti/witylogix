# .github/workflows/docker.yml
# Docker Build and Registry Pipeline for Witylogix Platform
#
# Handles:
#   - Multi-stage Docker builds with layer caching
#   - Multi-architecture support (linux/amd64, linux/arm64)
#   - Push to ghcr.io with proper tagging (sha, branch, latest)
#   - Vulnerability scanning with Trivy
#   - SBOM (Software Bill of Materials) generation
#
# Triggered on: push to main, manual dispatch

name: Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build for'
        required: false
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job: Build Docker Image
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,suffix=-latest
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Save image name for next steps
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Vulnerability Scan with Trivy
  # ───────────────────────────────────────────────────────────────────────────
  scan:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Display vulnerability summary
        run: |
          echo "Vulnerability Scan Complete"
          echo "Results saved to trivy-results.sarif"
          echo "Check the Security tab for detailed findings"

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Generate SBOM (Software Bill of Materials)
  # ───────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 30

      - name: Attach SBOM to image
        run: |
          echo "SBOM artifacts generated:"
          echo "  - sbom.spdx.json (SPDX format)"
          echo "  - sbom.cyclonedx.json (CycloneDX format)"
          echo "Store these for supply chain security audits"

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Docker Build Summary
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, scan, sbom]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Docker build complete
        run: |
          echo "Docker Build Pipeline Complete"
          echo "================================"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "Build Status:"
          echo "  Build: ${{ needs.build.result }}"
          echo "  Scan: ${{ needs.scan.result }}"
          echo "  SBOM: ${{ needs.sbom.result }}"
          echo ""
          echo "Next Steps:"
          echo "  1. Review vulnerability scan results in Security tab"
          echo "  2. Download SBOM from artifacts for compliance audits"
          echo "  3. Deploy image to target environment"
