# .github/workflows/build-push-images.yml
# Multi-app container image pipeline for WityLogix self-hosting
#
# Builds a separate image for each app in the monorepo and pushes to:
#   ghcr.io/wityliti/witylogix/<app>:<tag>
#
# Triggered on:
#   - push to `staging`
#   - push of a `v*` semver tag (release)
#   - manual workflow_dispatch

name: Build & Push Images

on:
  push:
    branches:
      - staging
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated list of apps to build (leave blank for all)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ORG: wityliti
  REPO: witylogix

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Resolve which apps to build and compute shared tags
  # ─────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tags_suffix: ${{ steps.meta.outputs.tags_suffix }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute tag suffix
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags_suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags_suffix=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set build matrix
        id: set-matrix
        run: |
          ALL_APPS='["api","dashboard","customer-portal","tracking-page","shopify-app"]'
          INPUT="${{ github.event.inputs.apps }}"
          if [[ -n "$INPUT" ]]; then
            # Convert comma-separated input to JSON array
            APPS=$(echo "$INPUT" | tr ',' '\n' | jq -R . | jq -cs .)
            echo "matrix={\"app\":$APPS}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"app\":$ALL_APPS}" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Build and push one image per app in parallel
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.REPO }}/${{ matrix.app }}
          tags: |
            # Branch push → branch-name tag
            type=ref,event=branch
            # Semver tag push → version tags (e.g. v1.2.3, v1.2, v1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Always tag with short SHA for traceability
            type=sha,prefix=sha-,format=short
            # `latest` only on semver releases
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            BUILD_DATE=${{ fromJson(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.prepare.outputs.tags_suffix }}

  # ─────────────────────────────────────────────────────────────────────────
  # Post-build summary
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Print image references
        run: |
          echo "## Image build results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | Image | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for app in api dashboard customer-portal tracking-page shopify-app; do
            IMAGE="${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.REPO }}/$app:sha-${{ needs.prepare.outputs.sha_short }}"
            echo "| $app | \`$IMAGE\` | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          done
