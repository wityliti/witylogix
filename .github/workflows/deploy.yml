# .github/workflows/deploy.yml
# Continuous Deployment Pipeline for Witylogix
#
# Runs on:
#   - Push to main branch (only after CI passes)
#
# Steps:
#   1. Build Docker images (API, Dashboard, Shopify App)
#   2. Tag images with Git SHA and 'latest'
#   3. Push to container registry (ghcr.io)
#   4. Deploy to target environment (Kubernetes, Fly.io, Railway, etc.)

name: Deploy

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job: Build and Push Docker Images
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    # Only run if CI passed (when triggered by workflow_run)
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Dashboard)
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.dashboard
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Shopify App)
        id: meta-shopify
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/shopify-app
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Shopify App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.shopify-app
          push: true
          tags: ${{ steps.meta-shopify.outputs.tags }}
          labels: ${{ steps.meta-shopify.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # Job: Deploy to environment
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "Deploying commit ${{ github.sha }} to production..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:latest"

      # ─────────────────────────────────────────────────────────────────────────
      # Option 1: Kubernetes Deployment
      # Uncomment and configure for K8s cluster
      # ─────────────────────────────────────────────────────────────────────────
      # - name: Deploy to Kubernetes
      #   uses: actions-hub/kubectl@master
      #   env:
      #     KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      #   with:
      #     args: >-
      #       set image deployment/witylogix-api
      #       api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
      #       --namespace=production --record

      # ─────────────────────────────────────────────────────────────────────────
      # Option 2: Fly.io Deployment
      # Uncomment and install flyctl for Fly.io
      # ─────────────────────────────────────────────────────────────────────────
      # - name: Deploy to Fly.io
      #   uses: superfly/flyctl-actions@master
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      #   with:
      #     args: "deploy"

      # ─────────────────────────────────────────────────────────────────────────
      # Option 3: Railway Deployment
      # Uncomment for Railway.app
      # ─────────────────────────────────────────────────────────────────────────
      # - name: Deploy to Railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #   run: |
      #     npx @railway/cli@latest deploy --force

      # ─────────────────────────────────────────────────────────────────────────
      # Option 4: Manual deploy script
      # Create infra/deploy-scripts/railway.sh for custom deployment logic
      # ─────────────────────────────────────────────────────────────────────────
      # - name: Run custom deployment script
      #   env:
      #     DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      #     DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      #   run: |
