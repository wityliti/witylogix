name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-guard:
    name: Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Check pnpm-lock.yaml is up to date
        run: |
          pnpm install --frozen-lockfile
          # Ensure pnpm-lock.yaml was not modified — guards against WIT-227 class of failures
          git diff --exit-code pnpm-lock.yaml || (echo "pnpm-lock.yaml is out of sync with package.json. Run 'pnpm install' and commit the updated lockfile." && exit 1)

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r --parallel run lint --max-warnings 0
      - name: Format check
        run: pnpm format --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages (required for type resolution)
        run: |
          pnpm --filter @witylogix/db db:generate
          pnpm --filter @witylogix/types build
          pnpm --filter @witylogix/validators build
          pnpm --filter @witylogix/framework build
      - name: Typecheck all packages
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @witylogix/db db:generate
          pnpm --filter @witylogix/types build
          pnpm --filter @witylogix/validators build
          pnpm --filter @witylogix/framework build

      - name: Build API
        run: pnpm --filter @witylogix/api build

      - name: Build dashboard
        run: pnpm --filter @witylogix/dashboard build

      - name: Build customer-portal
        run: pnpm --filter @witylogix/customer-portal build

      - name: Build shopify-app
        run: pnpm --filter @witylogix/shopify-app build

      - name: Build tracking-page
        run: pnpm --filter @witylogix/tracking-page build

      - name: Build docs
        run: pnpm --filter @witylogix/docs build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build db package
        run: |
          pnpm --filter @witylogix/db db:generate
          pnpm --filter @witylogix/db build

      - name: Run tests
        run: pnpm test:run

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
