name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @witylogix/types build && pnpm --filter @witylogix/validators build

      - name: TypeScript check
        run: pnpm -r --parallel run typecheck || true

      - name: Run tests
        run: pnpm --filter @witylogix/validators test || true

      - name: Build API
        run: pnpm --filter @witylogix/api build || true
