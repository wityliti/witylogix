# infra/docker/nginx/ssl.conf
# Production SSL/TLS Configuration for Witylogix
#
# Security features:
# - TLS 1.2 and 1.3 only (no legacy protocols)
# - Modern cipher suite with perfect forward secrecy
# - OCSP stapling for certificate revocation checking
# - HSTS for strict transport security
# - Session resumption for performance
# - Let's Encrypt integration with certbot
#
# Certificate paths:
# - TLS certificates: ./certs/
# - Keys: ./certs/
# - DH parameters: ./certs/dhparam.pem
#
# To generate DH parameters (one-time):
#   openssl dhparam -out ./certs/dhparam.pem 2048

# SSL certificate paths (Let's Encrypt)
ssl_certificate /etc/nginx/certs/live/localhost/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/live/localhost/privkey.pem;

# Use intermediate CA certificate for OCSP stapling
ssl_trusted_certificate /etc/nginx/certs/live/localhost/chain.pem;

# Protocol versions: TLS 1.2 and 1.3 only (no legacy SSLv3, TLSv1.0, TLSv1.1)
ssl_protocols TLSv1.2 TLSv1.3;

# Modern cipher suite with perfect forward secrecy
# Prioritized by server (ssl_prefer_server_ciphers on)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Server chooses cipher suite (protects against client-side downgrades)
ssl_prefer_server_ciphers on;

# Diffie-Hellman parameter for perfect forward secrecy with DHE ciphers
ssl_dhparam /etc/nginx/dhparam.pem;

# OCSP stapling: verify certificate revocation without contacting revocation servers
ssl_stapling on;
ssl_stapling_verify on;

# OCSP resolver configuration (CloudFlare public DNS)
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;

# Session resumption configuration
# Session ID: allows browsers to resume TLS session (performance optimization)
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets on;
ssl_session_ticket_key /etc/nginx/certs/session_ticket_key;

# Elliptic curve for TLS handshake (ECDHE key agreement)
ssl_ecdh_curve secp384r1:secp256k1:secp256r1;

# HTTP/2 Server Push (optional, for critical assets)
# Handled by proxy_pass configuration

# HSTS: Force HTTPS for all future requests from this browser
# max-age: 1 year, includeSubDomains: apply to all subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Additional security headers (applied in main nginx.conf, but repeated here for clarity)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable SSL information leakage
server_tokens off;

# Minimum TLS version for clients
# Modern clients should support TLS 1.2+
# Older clients (Android 4.x, IE 10) will be rejected
