# infra/docker/nginx/nginx.conf
# Production-grade Nginx configuration for Witylogix platform
#
# Features:
# - TLS 1.2+ with modern cipher suites for security
# - GZIP compression for bandwidth efficiency
# - Rate limiting to prevent abuse
# - Security headers (CSP, HSTS, X-Frame, etc.)
# - Upstream health checks
# - WebSocket support with proper headers
# - Static asset caching with long expiry for hashed files
# - Structured logging for observability
# - HTTP/HTTPS redirect with ACME challenge support

user nginx;

# Auto-detect CPU count for optimal performance
worker_processes auto;

# Increase file descriptor limit for high-traffic environments
worker_rlimit_nofile 65535;

# Error log with severity levels
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Structured logging format for production monitoring
  log_format main_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"request":"$request",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referrer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"upstream_addr":"$upstream_addr"'
    '}';

  access_log /var/log/nginx/access.log main_json;

  # Performance tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Gzip compression for text-based content
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/atom+xml image/svg+xml;
  gzip_min_length 1000;
  gzip_disable "msie6";

  # Rate limiting zones for abuse prevention
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=1000r/s;

  # Connection limiting per IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Cache zones for static assets
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=2g inactive=365d;

  # Upstream API service with health checks
  upstream api {
    server api:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Upstream Dashboard service with health checks
  upstream dashboard {
    server dashboard:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Server block: HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenges for certificate renewal
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$http_host$request_uri;
    }

    # Health check endpoint for load balancers (responds over HTTP)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }
  }

  # Include SSL/TLS configuration
  include /etc/nginx/conf.d/ssl.conf;

  # Server block: API reverse proxy with SSL
  server {
    listen 443 ssl http2;
    server_name api.* ~^api\..*\.localhost$;

    # SSL configuration (included from ssl.conf)
    # ssl_certificate, ssl_certificate_key, etc.

    # Rate limiting for API endpoints
    limit_req zone=api_limit burst=200 nodelay;
    limit_conn conn_limit 100;

    # API routing configuration
    location / {
      proxy_pass http://api;

      # Proxy headers for proper connection handling
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      # Timeouts for long-lived connections
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffering configuration
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;
    }

    # WebSocket endpoint for real-time features
    location /ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket specific timeouts (longer-lived connections)
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_connect_timeout 7d;

      # Disable buffering for WebSocket
      proxy_buffering off;
    }

    # Security headers for API
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Server block: Dashboard reverse proxy with SSL
  server {
    listen 443 ssl http2;
    server_name app.* ~^app\..*\.localhost$ dashboard.*;

    # SSL configuration
    # ssl_certificate, ssl_certificate_key, etc.

    # Rate limiting for dashboard
    limit_req zone=login_limit burst=20 nodelay;
    limit_conn conn_limit 50;

    # Dashboard routing
    location / {
      proxy_pass http://dashboard;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Serve static assets with long cache expiry
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|woff|woff2|eot|ttf|otf|svg)$ {
      proxy_pass http://dashboard;
      proxy_cache static_cache;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Security headers for dashboard
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Default server block (catch-all)
  server {
    listen 443 ssl http2 default_server;
    server_name _;

    location / {
      return 404;
    }

    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
}
