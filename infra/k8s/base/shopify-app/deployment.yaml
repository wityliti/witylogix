apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopify-app
  labels:
    app.kubernetes.io/name: shopify-app
    app.kubernetes.io/part-of: witylogix
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shopify-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopify-app
        app.kubernetes.io/part-of: witylogix
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: shopify-app
          image: ghcr.io/wityliti/witylogix/shopify-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: witylogix-secrets
                  key: DATABASE_URL
            - name: SHOPIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: witylogix-secrets
                  key: SHOPIFY_API_KEY
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: witylogix-secrets
                  key: SHOPIFY_API_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
