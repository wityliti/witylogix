# SECRET TEMPLATE — do NOT commit real values.
# Copy this file to a secrets manager (e.g. External Secrets Operator,
# Sealed Secrets, or Vault) and inject at deploy time.
#
# Usage:
#   kubectl create secret generic witylogix-secrets \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=SHOPIFY_API_SECRET='...' \
#     -n <namespace> --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: witylogix-secrets
  labels:
    app.kubernetes.io/part-of: witylogix
type: Opaque
stringData:
  DATABASE_URL: "<inject-at-deploy-time>"
  REDIS_URL: "<inject-at-deploy-time>"
  JWT_SECRET: "<inject-at-deploy-time>"
  SHOPIFY_API_KEY: "<inject-at-deploy-time>"
  SHOPIFY_API_SECRET: "<inject-at-deploy-time>"
  SHOPIFY_WEBHOOK_SECRET: "<inject-at-deploy-time>"
  SMTP_HOST: "<inject-at-deploy-time>"
  SMTP_USER: "<inject-at-deploy-time>"
  SMTP_PASS: "<inject-at-deploy-time>"
  SENTRY_DSN: "<inject-at-deploy-time>"
