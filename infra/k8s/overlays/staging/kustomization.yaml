apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: witylogix-staging

resources:
  - ../../base

namePrefix: ""
nameSuffix: ""

labels:
  - pairs:
      environment: staging

images:
  - name: ghcr.io/wityliti/witylogix/api
    newTag: staging
  - name: ghcr.io/wityliti/witylogix/dashboard
    newTag: staging
  - name: ghcr.io/wityliti/witylogix/customer-portal
    newTag: staging
  - name: ghcr.io/wityliti/witylogix/tracking-page
    newTag: staging
  - name: ghcr.io/wityliti/witylogix/shopify-app
    newTag: staging

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: witylogix-staging
    target:
      kind: Namespace
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: api
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.witylogix.com
      - op: replace
        path: /spec/rules/1/host
        value: app.staging.witylogix.com
      - op: replace
        path: /spec/rules/2/host
        value: portal.staging.witylogix.com
      - op: replace
        path: /spec/rules/3/host
        value: track.staging.witylogix.com
      - op: replace
        path: /spec/rules/4/host
        value: shopify.staging.witylogix.com
    target:
      kind: Ingress
      name: witylogix
