# Root railway.toml — shared defaults only.
# Each service uses RAILWAY_DOCKERFILE_PATH env var (set per-service in Railway dashboard)
# to specify its own Dockerfile. Do NOT add [build] dockerfilePath here as it overrides
# all services in the monorepo.

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
