[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.shopify-app"

[deploy]
startCommand = "node node_modules/@react-router/serve/bin.js ./build/server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
internalPort = 3000
